plugins {
    id 'com.android.application' version '8.13.0'
}

def ferryInputs = file(providers.gradleProperty('ferryInputs').get())
def ferryGenerated = file(providers.gradleProperty('ferryGenerated').get())
def slintJava = file(providers.gradleProperty('slintJava').get())

android {
    namespace 'io.github.shiroksh.streamtube'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.shiroksh.streamtube'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('streamTubeVersionCode').get().toInteger()
        versionName providers.gradleProperty('streamTubeVersion').get()
    }

    sourceSets {
        main {
            manifest.srcFile new File(ferryInputs, 'AndroidManifest.xml')
            res.srcDir new File(ferryGenerated, 'res')
            // Stream Tube's adaptive launcher icon (the manifest points at @mipmap/ic_stream_tube)
            res.srcDir 'launcher-res'
            java.srcDirs(
                new File(ferryGenerated, 'java'),
                slintJava,
                '../src/features/player/ui',
                '../src/features/updater/ui'
            )
            jniLibs.srcDir new File(ferryInputs, 'jniLibs')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += ['**/libstream_tube_android.so']
        }
    }
}

dependencies {
    // The native watch page plays YouTube's HLS manifests (see src/features/player).
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    // Background playback: the media notification, lock screen and headset controls.
    implementation 'androidx.media3:media3-session:1.11.1'
}
